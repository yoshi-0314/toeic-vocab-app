<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英単語フラッシュカード</title>
<style>
  :root {
    --bg: #f7f9fc;
    --card-bg: #ffffff;
    --card-back-bg: #eef4ff;
    --accent: #3b6ee0;
    --accent-dark: #2c54b3;
    --accent-light: #dbe6fb;
    --text-main: #1f2937;
    --text-sub: #6b7280;
    --shadow: 0 10px 30px rgba(59, 110, 224, 0.12);
    --danger: #e05353;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 40px;
  }

  header {
    width: 100%;
    max-width: 520px;
    text-align: center;
    margin-bottom: 20px;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--accent-dark);
    letter-spacing: 0.02em;
  }

  header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 0.85rem;
  }

  .app {
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  /* status views */
  .status-view {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    min-height: 320px;
    width: 100%;
  }

  .spinner {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 4px solid var(--accent-light);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status-view p {
    color: var(--text-sub);
    font-size: 0.95rem;
    text-align: center;
  }

  .banner {
    width: 100%;
    max-width: 520px;
    background: #fff6e5;
    border: 1px solid #f3cf83;
    color: #8a6416;
    font-size: 0.8rem;
    padding: 10px 14px;
    border-radius: 12px;
    text-align: center;
    display: none;
  }

  .banner.show {
    display: block;
  }

  /* progress */
  .progress-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .progress-count {
    font-size: 0.85rem;
    color: var(--text-sub);
    white-space: nowrap;
    min-width: 58px;
    text-align: right;
  }

  .progress-track {
    flex: 1;
    height: 6px;
    background: var(--accent-light);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-bar {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.25s ease;
  }

  /* flashcard */
  .card-scene {
    width: 100%;
    max-width: 420px;
    height: 320px;
    perspective: 1400px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    transform-style: preserve-3d;
  }

  .card:active {
    transform: scale(0.98);
  }

  .card.flipped {
    transform: rotateY(180deg);
  }

  .card.flipped:active {
    transform: rotateY(180deg) scale(0.98);
  }

  .card-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
  }

  .card-front {
    background: var(--card-bg);
    border: 1px solid #e7ecf5;
  }

  .card-back {
    background: var(--card-back-bg);
    border: 1px solid #cfe0fb;
    transform: rotateY(180deg);
  }

  .card-label {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 0.72rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.7;
  }

  .card-english {
    font-size: 2rem;
    font-weight: 700;
    color: var(--text-main);
    word-break: break-word;
    line-height: 1.3;
  }

  .card-hint {
    margin-top: 18px;
    font-size: 0.8rem;
    color: var(--text-sub);
  }

  .card-japanese {
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent-dark);
    margin-bottom: 16px;
    line-height: 1.4;
    word-break: break-word;
  }

  .card-example {
    font-size: 0.95rem;
    color: var(--text-main);
    line-height: 1.6;
    background: rgba(255, 255, 255, 0.6);
    border-radius: 12px;
    padding: 12px 16px;
  }

  .card-example-label {
    display: block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }

  /* controls */
  .reveal-btn {
    width: 100%;
    max-width: 420px;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 16px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(59, 110, 224, 0.25);
    transition: background 0.15s ease, transform 0.1s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .reveal-btn:active {
    transform: translateY(1px) scale(0.99);
    background: var(--accent-dark);
  }

  .nav-controls {
    width: 100%;
    max-width: 420px;
    display: flex;
    gap: 12px;
  }

  .nav-btn {
    flex: 1;
    padding: 18px 10px;
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent-dark);
    background: var(--card-bg);
    border: 2px solid var(--accent-light);
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }

  .nav-btn:active {
    transform: translateY(1px) scale(0.98);
    background: var(--accent-light);
  }

  .nav-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }

  .nav-btn:disabled:active {
    transform: none;
    background: var(--card-bg);
  }

  .shuffle-btn {
    width: 100%;
    max-width: 420px;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-sub);
    background: transparent;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .hidden {
    display: none !important;
  }

  @media (max-width: 380px) {
    .card-scene {
      height: 300px;
    }
    .card-english {
      font-size: 1.6rem;
    }
    .card-japanese {
      font-size: 1.3rem;
    }
  }
</style>
</head>
<body>

  <header>
    <h1>英単語フラッシュカード</h1>
    <p>TOEIC単語帳で毎日コツコツ学習しよう</p>
  </header>

  <div class="app">

    <div id="loadingView" class="status-view">
      <div class="spinner"></div>
      <p>単語データを読み込んでいます...</p>
    </div>

    <div id="errorFatalView" class="status-view hidden">
      <p>データの読み込みに失敗し、表示できる単語がありません。<br>時間をおいて再度お試しください。</p>
      <button class="reveal-btn" id="retryBtn" style="max-width:260px;">再読み込み</button>
    </div>

    <div id="mainView" class="hidden" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:20px;">

      <div id="errorBanner" class="banner"></div>

      <div class="progress-wrap">
        <div class="progress-track">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="progress-count" id="progressCount">0 / 0</div>
      </div>

      <div class="card-scene">
        <div class="card" id="card">
          <div class="card-face card-front">
            <span class="card-label">English</span>
            <div class="card-english" id="englishText"></div>
            <div class="card-hint">タップして答えを見る</div>
          </div>
          <div class="card-face card-back">
            <span class="card-label">Japanese</span>
            <div class="card-japanese" id="japaneseText"></div>
            <div class="card-example" id="exampleWrap">
              <span class="card-example-label">例文</span>
              <span id="exampleText"></span>
            </div>
          </div>
        </div>
      </div>

      <button class="reveal-btn" id="revealBtn">答えを見る</button>

      <div class="nav-controls">
        <button class="nav-btn" id="prevBtn">← 前の単語</button>
        <button class="nav-btn" id="nextBtn">次の単語 →</button>
      </div>

      <button class="shuffle-btn" id="shuffleBtn">🔀 シャッフルする</button>
    </div>

  </div>

<script>
(function () {
  "use strict";

  var CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDMYAdMad5qK9-vVZmHKs0PSyvO1pZBc_lIKV_6IzNswB7uHrYY7_i5MHincQLDiMDEjqlmQ_QO97D/pub?output=csv";

  var MOCK_DATA = [
    { english: "abundant", japanese: "豊富な、たくさんの", example: "The region has abundant natural resources." },
    { english: "negotiate", japanese: "交渉する", example: "They negotiated a new contract with the supplier." },
    { english: "reimburse", japanese: "払い戻す、返済する", example: "The company will reimburse your travel expenses." }
  ];

  var state = {
    words: [],
    index: 0,
    flipped: false
  };

  var loadingView = document.getElementById("loadingView");
  var errorFatalView = document.getElementById("errorFatalView");
  var mainView = document.getElementById("mainView");
  var errorBanner = document.getElementById("errorBanner");
  var retryBtn = document.getElementById("retryBtn");

  var cardEl = document.getElementById("card");
  var englishText = document.getElementById("englishText");
  var japaneseText = document.getElementById("japaneseText");
  var exampleText = document.getElementById("exampleText");
  var exampleWrap = document.getElementById("exampleWrap");

  var revealBtn = document.getElementById("revealBtn");
  var prevBtn = document.getElementById("prevBtn");
  var nextBtn = document.getElementById("nextBtn");
  var shuffleBtn = document.getElementById("shuffleBtn");
  var progressBar = document.getElementById("progressBar");
  var progressCount = document.getElementById("progressCount");

  function showView(view) {
    loadingView.classList.add("hidden");
    errorFatalView.classList.add("hidden");
    mainView.classList.add("hidden");
    view.classList.remove("hidden");
  }

  function parseCSV(text) {
    var rows = [];
    var row = [];
    var field = "";
    var inQuotes = false;

    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      var next = text[i + 1];

      if (inQuotes) {
        if (ch === '"' && next === '"') {
          field += '"';
          i++;
        } else if (ch === '"') {
          inQuotes = false;
        } else {
          field += ch;
        }
      } else {
        if (ch === '"') {
          inQuotes = true;
        } else if (ch === ',') {
          row.push(field);
          field = "";
        } else if (ch === '\r') {
          // skip, handled by \n
        } else if (ch === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else {
          field += ch;
        }
      }
    }
    // last field/row
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(function (r) {
      return r.some(function (c) { return c.trim().length > 0; });
    });
  }

  function rowsToWords(rows) {
    if (rows.length === 0) return [];
    var header = rows[0].map(function (h) { return h.trim().toLowerCase(); });
    var idxEnglish = header.indexOf("english");
    var idxJapanese = header.indexOf("japanese");
    var idxExample = header.indexOf("example");

    // fallback to positional columns if header names aren't matched
    if (idxEnglish === -1) idxEnglish = 0;
    if (idxJapanese === -1) idxJapanese = 1;
    if (idxExample === -1) idxExample = 2;

    var words = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var english = (r[idxEnglish] || "").trim();
      var japanese = (r[idxJapanese] || "").trim();
      var example = (r[idxExample] || "").trim();
      if (english) {
        words.push({ english: english, japanese: japanese, example: example });
      }
    }
    return words;
  }

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i];
      a[i] = a[j];
      a[j] = tmp;
    }
    return a;
  }

  function showBanner(msg) {
    errorBanner.textContent = msg;
    errorBanner.classList.add("show");
  }

  function renderCard() {
    if (state.words.length === 0) return;
    var w = state.words[state.index];
    englishText.textContent = w.english;
    japaneseText.textContent = w.japanese || "(訳なし)";
    if (w.example) {
      exampleWrap.classList.remove("hidden");
      exampleText.textContent = w.example;
    } else {
      exampleWrap.classList.add("hidden");
    }

    state.flipped = false;
    cardEl.classList.remove("flipped");

    prevBtn.disabled = state.index === 0;
    nextBtn.disabled = state.index === state.words.length - 1;

    progressCount.textContent = (state.index + 1) + " / " + state.words.length;
    progressBar.style.width = ((state.index + 1) / state.words.length * 100) + "%";
  }

  function flipCard() {
    state.flipped = !state.flipped;
    cardEl.classList.toggle("flipped", state.flipped);
  }

  function goNext() {
    if (state.index < state.words.length - 1) {
      state.index++;
      renderCard();
    }
  }

  function goPrev() {
    if (state.index > 0) {
      state.index--;
      renderCard();
    }
  }

  function startApp(words, opts) {
    opts = opts || {};
    state.words = words;
    state.index = 0;
    showView(mainView);
    if (opts.usedFallback) {
      showBanner("データの取得に失敗したため、サンプルデータを表示しています。");
    }
    renderCard();
  }

  function loadData() {
    showView(loadingView);
    errorBanner.classList.remove("show");

    fetch(CSV_URL, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.text();
      })
      .then(function (text) {
        var rows = parseCSV(text);
        var words = rowsToWords(rows);
        if (words.length === 0) throw new Error("No data parsed");
        startApp(words, { usedFallback: false });
      })
      .catch(function (err) {
        console.error("CSV読み込みエラー、モックデータにフォールバックします:", err);
        startApp(MOCK_DATA, { usedFallback: true });
      });
  }

  cardEl.addEventListener("click", flipCard);
  revealBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    flipCard();
  });
  nextBtn.addEventListener("click", goNext);
  prevBtn.addEventListener("click", goPrev);
  shuffleBtn.addEventListener("click", function () {
    state.words = shuffleArray(state.words);
    state.index = 0;
    renderCard();
  });
  retryBtn.addEventListener("click", loadData);

  loadData();
})();
</script>

</body>
</html>
